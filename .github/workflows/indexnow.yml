# Tells Bing (and other IndexNow search engines: Yandex, Seznam, Naver) about every URL
# in the sitemaps after each push to main, so new and changed pages get crawled quickly.
# The key file lives at public/8fce3a091e294eeefee37045f31b8431.txt.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel deploy to go live
        run: sleep 240

      - name: Submit sitemap URLs to IndexNow
        env:
          HOST: kriosity.in
          KEY: 8fce3a091e294eeefee37045f31b8431
        run: |
          set -euo pipefail
          urls=$( { curl -fsSL "https://$HOST/sitemap.xml"; curl -fsSL "https://$HOST/blog/sitemap.xml" || true; } \
            | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##' | sort -u )
          count=$(printf '%s\n' "$urls" | grep -c . || true)
          echo "Submitting $count URLs"
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -s --arg host "$HOST" --arg key "$KEY" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: .}')
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' -d "$payload")
          echo "IndexNow responded $status"
          # 200 = accepted, 202 = accepted and key check pending
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then exit 1; fi
